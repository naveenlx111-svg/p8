<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaMart</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6f7fb; color: #1d2230; }
  header { display: flex; align-items: center; gap: 24px; padding: 14px 32px; background: #fff; border-bottom: 1px solid #e3e6ef; }
  .logo { font-weight: 800; font-size: 22px; color: #3448c5; text-decoration: none; }
  form.search { display: flex; gap: 8px; flex: 1; max-width: 520px; }
  form.search input { flex: 1; padding: 9px 12px; border: 1px solid #c9cedc; border-radius: 8px; font-size: 15px; }
  .btn { padding: 9px 18px; border-radius: 8px; border: 0; background: #3448c5; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn.secondary { background: #e8ebf6; color: #1d2230; }
  .cart-link { margin-left: auto; color: #1d2230; font-weight: 600; text-decoration: none; }
  main { max-width: 980px; margin: 32px auto; padding: 0 24px; }
  h1 { margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .card { background: #fff; border: 1px solid #e3e6ef; border-radius: 12px; padding: 18px; }
  .card a.title { font-weight: 700; color: #1d2230; text-decoration: none; font-size: 17px; }
  .price { font-size: 20px; font-weight: 700; margin: 8px 0; }
  .muted { color: #5b6275; }
  .thumb { height: 110px; border-radius: 8px; background: linear-gradient(135deg,#dfe4fb,#f1f3fb); margin-bottom: 12px; display:flex; align-items:center; justify-content:center; font-size: 42px; }
  .product { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  .product .thumb { height: 280px; font-size: 96px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; }
  td, th { padding: 14px 16px; border-bottom: 1px solid #e3e6ef; text-align: left; }
  .summary { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  .hidden { display: none !important; }
  .overlay { position: fixed; inset: 0; background: rgba(15, 20, 40, .55); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .modal { background: #fff; border-radius: 16px; padding: 28px; width: 420px; position: relative; }
  .modal .close { position: absolute; top: 10px; right: 12px; background: none; border: 0; font-size: 24px; cursor: pointer; color: #5b6275; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field input { padding: 10px 12px; border: 1px solid #c9cedc; border-radius: 8px; font-size: 15px; }
  .fake-label { font-weight: 600; font-size: 14px; }
  label { font-weight: 600; font-size: 14px; }
  /* Planted defect C2: insufficient contrast on the primary CTA (solid colours for deterministic axe detection). */
  .pay-button { background: #c4d4ff; color: #aab8df; padding: 12px 22px; border: 0; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<header>
  <a class="logo" href="#/">NovaMart</a>
  <form class="search" id="search-form" role="search">
    <label for="search-input" style="position:absolute;left:-9999px">Search products</label>
    <input id="search-input" type="search" placeholder="Search products" autocomplete="off">
    <button class="btn" type="submit">Search</button>
  </form>
  <a class="cart-link" href="#/cart" id="cart-link">Cart (0)</a>
</header>
<main id="view"></main>

<div class="overlay hidden" id="promo-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="promo-title">
    <button class="close" type="button" aria-label="Close" id="promo-close">×</button>
    <h2 id="promo-title">Join Nova+ and save 10%</h2>
    <p class="muted">Members get free delivery and early access to sales. Only ₹199/month.</p>
    <div style="display:flex;gap:10px;margin-top:18px">
      <button class="btn" type="button" id="promo-join">Join Nova+</button>
      <button class="btn secondary" type="button" id="promo-dismiss">Maybe later</button>
    </div>
  </div>
</div>

<script>
const PRODUCTS = [
  { id: "nova", name: "Nova Headphones", price: 2499, icon: "🎧", blurb: "Wireless over-ear headphones with 30-hour battery life." },
  { id: "nova-pro", name: "Nova Pro Headphones", price: 4999, icon: "🎧", blurb: "Flagship noise-cancelling headphones." },
  { id: "nova-buds", name: "Nova Earbuds", price: 1299, icon: "🎵", blurb: "Compact true-wireless earbuds." },
  { id: "aura", name: "Aura Speaker", price: 3499, icon: "🔊", blurb: "Portable Bluetooth speaker." },
  { id: "pulse", name: "Pulse Watch", price: 5999, icon: "⌚", blurb: "Fitness smartwatch with heart-rate tracking." },
];
// Controlled candidate release for PathLens' differential UX-regression demo.
// The navigator receives only the URL and rendered UI; it never sees this flag.
const RELEASE = new URLSearchParams(location.search).get("release") || "baseline";
// Planted defect A: the cart charges a different unit price than the product page advertises.
const CART_PRICE_OVERRIDE = { nova: 2799 };

const store = {
  get cart() { return JSON.parse(sessionStorage.getItem("cart") || "[]"); },
  set cart(v) { sessionStorage.setItem("cart", JSON.stringify(v)); },
  get checkoutAttempted() { return sessionStorage.getItem("checkoutAttempted") === "1"; },
  set checkoutAttempted(v) { sessionStorage.setItem("checkoutAttempted", v ? "1" : "0"); },
};

const inr = n => "₹" + n.toLocaleString("en-IN");
const view = document.getElementById("view");
const find = id => PRODUCTS.find(p => p.id === id);

function card(p) {
  return `<div class="card"><div class="thumb" aria-hidden="true">${p.icon}</div>
    <a class="title" href="#/product/${p.id}">${p.name}</a>
    <div class="price">${inr(p.price)}</div><div class="muted">${p.blurb}</div></div>`;
}

const routes = {
  home() {
    view.innerHTML = `<h1>Welcome to NovaMart</h1>
      <p class="muted">Audio and wearables, delivered fast.</p>
      <h2>Trending now</h2>
      <div class="grid">${["aura", "pulse", "nova-buds"].map(id => card(find(id))).join("")}</div>`;
  },
  results(params) {
    const q = (params.get("q") || "").trim().toLowerCase();
    const hits = PRODUCTS.filter(p => q && p.name.toLowerCase().includes(q));
    view.innerHTML = `<h1>Results for “${q}”</h1>
      <p class="muted">${hits.length} product${hits.length === 1 ? "" : "s"} found</p>
      <div class="grid">${hits.map(card).join("") || "<p>No products match your search.</p>"}</div>`;
  },
  product(params, id) {
    const p = find(id);
    if (!p) { view.innerHTML = "<h1>Product not found</h1>"; return; }
    view.innerHTML = `<div class="product"><div class="thumb" aria-hidden="true">${p.icon}</div>
      <div><h1>${p.name}</h1><div class="price">${inr(p.price)}</div>
      <p class="muted">${p.blurb}</p><p>In stock · Free returns within 7 days</p>
      <button class="btn" type="button" id="add-to-cart">Add to Cart</button></div></div>`;
    document.getElementById("add-to-cart").onclick = () => {
      const cart = store.cart;
      const line = cart.find(l => l.id === p.id);
      if (line) line.qty += 1; else cart.push({ id: p.id, qty: 1 });
      store.cart = cart;
      location.hash = "#/cart";
    };
  },
  cart() {
    const lines = store.cart.map(l => {
      const p = find(l.id);
      return { ...p, qty: l.qty, unit: CART_PRICE_OVERRIDE[p.id] ?? p.price };
    });
    const total = lines.reduce((s, l) => s + l.unit * l.qty, 0);
    if (!lines.length) {
      view.innerHTML = `<h1>Your cart</h1><p>Your cart is empty.</p><a class="btn" href="#/">Continue shopping</a>`;
      return;
    }
    view.innerHTML = `<h1>Your cart</h1>
      <table><thead><tr><th>Product</th><th>Qty</th><th>Price</th></tr></thead><tbody>
      ${lines.map(l => `<tr><td>${l.name}</td><td>${l.qty}</td><td>${inr(l.unit)}</td></tr>`).join("")}
      </tbody></table>
      <div class="summary"><div class="price">Subtotal: ${inr(total)}</div>
      <div style="display:flex;gap:10px"><a class="btn secondary" href="#/">Continue shopping</a>
      <button class="btn" type="button" id="checkout-btn">Checkout</button></div></div>`;
    document.getElementById("checkout-btn").onclick = checkout;
  },
  checkout() {
    const total = store.cart.reduce((s, l) => s + (CART_PRICE_OVERRIDE[l.id] ?? find(l.id).price) * l.qty, 0);
    // Planted defect C1: the email field has visible text but no programmatic label.
    view.innerHTML = `<h1>Checkout</h1>
      <div class="card" style="max-width:520px">
        ${RELEASE === "candidate" ? '<button type="button"><span aria-hidden="true">?</span></button>' : ''}
        <div class="field"><div class="fake-label">Email</div><input id="checkout-email" type="email" autocomplete="off"></div>
        <div class="field"><label for="checkout-name">Full name</label><input id="checkout-name" type="text" autocomplete="off"></div>
        <div class="field"><label for="checkout-address">Delivery address</label><input id="checkout-address" type="text" autocomplete="off"></div>
        <button class="pay-button" type="button" id="pay-btn">Pay ${inr(total)}</button>
      </div>`;
    document.getElementById("pay-btn").onclick = () => { location.hash = "#/complete"; };
  },
  shipping() {
    view.innerHTML = `<h1>Delivery preferences</h1>
      <div class="card" style="max-width:520px">
        <p>Review delivery preferences before continuing.</p>
        <label><input type="radio" name="delivery" checked> Standard delivery · 3–5 days</label>
        <div style="margin-top:18px"><button class="btn" id="shipping-continue" type="button">Checkout</button></div>
      </div>`;
    document.getElementById("shipping-continue").onclick = () => { location.hash = "#/checkout"; };
  },
  complete() {
    store.cart = [];
    view.innerHTML = `<h1>Order placed</h1><p>Thank you for shopping with NovaMart.</p>`;
  },
};

// Planted defect B: the first checkout attempt opens a promotional modal instead of navigating (deterministic, no timers).
function checkout() {
  if (!store.checkoutAttempted) {
    store.checkoutAttempted = true;
    document.getElementById("promo-modal").classList.remove("hidden");
    return;
  }
  location.hash = RELEASE === "candidate" ? "#/shipping" : "#/checkout";
}
function closePromo() { document.getElementById("promo-modal").classList.add("hidden"); }
document.getElementById("promo-close").onclick = closePromo;
document.getElementById("promo-dismiss").onclick = closePromo;
document.getElementById("promo-join").onclick = closePromo;

document.getElementById("search-form").onsubmit = e => {
  e.preventDefault();
  location.hash = "#/results?q=" + encodeURIComponent(document.getElementById("search-input").value.trim());
};

function render() {
  const hash = location.hash.replace(/^#/, "") || "/";
  const [path, query] = hash.split("?");
  const params = new URLSearchParams(query || "");
  const parts = path.split("/").filter(Boolean);
  closePromo();
  if (parts.length === 0) routes.home();
  else if (parts[0] === "results") routes.results(params);
  else if (parts[0] === "product") routes.product(params, parts[1]);
  else if (routes[parts[0]]) routes[parts[0]](params);
  else view.innerHTML = "<h1>Page not found</h1>";
  const count = store.cart.reduce((s, l) => s + l.qty, 0);
  document.getElementById("cart-link").textContent = `Cart (${count})`;
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
